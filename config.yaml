# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Gotcha: "sde" as a bare regex does NOT match "Software Development
  # Engineer" — different words entirely. Use \bsde\b for the acronym and
  # list the spelled-out variants separately, as below.
  include_titles:
    - '\b(backend|back-end|server-side)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(backend|back-end)\b'
    - '\bnode\.?js\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\bnode\.?js\b'
    - '\bapi engineer\b'
    - '\bplatform engineer\b'
    - '\bfull[- ]stack\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\bfull[- ]stack\b'
    - '\bweb application engineer\b'
    - '\b(frontend|front-end|front end)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(frontend|front-end|front end)\b'
    - '\breact(\.js)?\b.*\b(engineer|developer)\b'
    - '\bnext\.?js\b.*\b(engineer|developer)\b'
    - '\bui engineer\b'
    - '\b(gen(?:erative)?[- ]?ai|genai)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(gen(?:erative)?[- ]?ai|genai)\b'
    - '\b(ai|artificial intelligence)\b.*\b(engineer|developer)\b'
    - '\bllm engineer\b'
    - '\brag engineer\b'
    - '\bai application engineer\b'
  # Anything matching these is dropped even if an include matched.
  exclude_titles:
# Not targeting internships or training programs now
    - '\b(intern|internship|apprentice|trainee)\b'
    - '\b(sales|account executive|marketing|recruiter|customer support|customer success)\b'
    - '\b(ios|android|mobile|game|embedded|firmware|kernel|networking|sre|site reliability)\b'
    - '\b(data scientist|research scientist|machine learning scientist)\b'
    - '\b(data analyst|business analyst|business intelligence analyst)\b'
    - '\b(qa engineer|quality assurance|test engineer|automation tester)\b'

  # Substrings matched against "<location> <title>", case-insensitive.
  # Leave empty to accept every location.
  locations:
    - bangalore
    - bengaluru
    - hyderabad
    - pune
    - gurugram
    - gurgaon
    - noida
    - delhi
    - mumbai
    - india
    

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 6.0      # below this, no draft and no digest slot
max_per_digest: 5         # hard cap on expensive draft calls per run

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
